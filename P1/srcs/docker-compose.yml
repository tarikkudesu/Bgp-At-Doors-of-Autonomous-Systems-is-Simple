---
name: p1

services:
  host:
    image: host_${LOGIN}:tar
    container_name: host-${LOGIN}
    build:
      context: ./host
      network: host
    network_mode: none
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN

  router:
    image: router_${LOGIN}:tar
    container_name: router-${LOGIN}
    build:
      context: ./router
      network: host
    network_mode: none
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
